<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<title>Tramoya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
// reproductor HLS: primero local (lo copia el workflow), si no, CDN
(function(){var s=document.createElement("script");s.src="hls.min.js";s.onerror=function(){var c=document.createElement("script");c.src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js";document.head.appendChild(c)};document.head.appendChild(s)})();
</script>
<style>
:root{
  --bg:#07070f;--bg2:#0d0d1a;--card:#12121f;--card2:#191929;--line:rgba(255,255,255,.08);
  --tx:#f3f3fb;--tx2:#a2a2bd;--tx3:#6d6d88;
  --a1:#7c5cff;--a2:#18c8e8;--grad:linear-gradient(135deg,var(--a1),var(--a2));
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;background:radial-gradient(120% 60% at 50% -10%,#1a1240 0%,transparent 60%),var(--bg)}
.view{position:absolute;inset:0;padding-bottom:calc(96px + var(--sab));overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}.view::-webkit-scrollbar{display:none}
/* marca */
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:22px;letter-spacing:-.4px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:0 4px 16px #7c5cff55}
.brand i svg{width:14px;height:14px;fill:#fff;stroke:#fff;margin-left:2px}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.head{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + var(--sat)) 18px 10px}
.hbtn{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx2)}
h1.t{font-size:28px;font-weight:700;letter-spacing:-.6px;padding:calc(18px + var(--sat)) 18px 6px}
/* nav flotante */
nav{position:absolute;left:14px;right:14px;bottom:calc(12px + var(--sab));height:68px;border-radius:26px;background:rgba(18,18,32,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);display:flex;padding:6px;gap:2px;z-index:20;box-shadow:0 12px 40px #000a}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:20px;color:var(--tx3);font-size:10.5px;font-weight:500;transition:.2s}
nav button.on{color:#fff;background:linear-gradient(135deg,#7c5cff33,#18c8e822);box-shadow:inset 0 0 0 1px #7c5cff55}
nav button.on svg{color:var(--a2)}
/* hero */
.hero{position:relative;margin:4px 16px 0;height:min(64vh,470px);border-radius:28px;overflow:hidden;background:var(--card);box-shadow:0 18px 50px #0009}
.hero .bg{position:absolute;inset:-20px;background:center/cover;filter:blur(28px) saturate(1.3);opacity:.55;transition:opacity .5s}
.hero .pst{position:absolute;left:50%;top:22px;width:46%;max-width:210px;aspect-ratio:2/3;transform:translateX(-50%);border-radius:18px;background:var(--card2) center/cover;box-shadow:0 18px 40px #000a;transition:opacity .4s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(7,7,15,.92) 90%)}
.hero .in{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 18px 18px;text-align:center}
.hero h2{font-size:23px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-bottom:7px}
.hero .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{font-size:11.5px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:var(--tx2);backdrop-filter:blur(8px)}
.pill.star{color:#ffd166}
.pill.star::before{content:"★ "}
.hact{display:flex;gap:10px;justify-content:center}
#rcover{position:fixed;inset:0;background:#07070f;z-index:400;display:none}#rcover.on{display:block}
#updov{position:fixed;inset:0;z-index:300;background:radial-gradient(circle at 50% 18%,#231b52,var(--bg) 62%);display:none;overflow:auto}
#updov.on{display:block}
#updov .uw{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(var(--sat) + 30px) 22px calc(var(--sab) + 26px);text-align:center}
#updov .ub{align-self:center;padding:6px 12px;border-radius:99px;background:rgba(255,79,123,.14);border:1px solid rgba(255,79,123,.45);color:#ff7a9a;font-size:11.5px;font-weight:800;letter-spacing:.06em}
#updov h1{font-size:54px;font-weight:900;line-height:1.05;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#updov .uc{color:var(--tx2);font-size:14px}
#updov .un{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.5;color:#d9d6f5;max-height:30vh;overflow:auto}
#updov .un ul{margin:6px 0 0;padding-left:18px}
#updov .upr{font-size:12.5px;font-weight:700;color:var(--tx2)}
#updov .ubar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin-bottom:8px}#updov .ubar i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
#updov .btn{width:100%;height:54px;font-size:16px;border:0}
#updov .btn[disabled]{opacity:.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:#fff;font-weight:600;font-size:15px;padding:13px 26px;border-radius:16px;box-shadow:0 10px 28px #7c5cff55}
.btn svg{width:18px;height:18px;fill:#fff;stroke:#fff}
.btn.sec{background:var(--card2);box-shadow:none;border:1px solid var(--line);padding:13px 15px}
.btn.sec svg{fill:none}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 2px}
.dots i{width:6px;height:6px;border-radius:6px;background:#ffffff33;transition:.3s}.dots i.on{width:20px;background:var(--grad)}
/* filas */
.row{margin:22px 0 0}
.row h3{display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:18px;font-weight:600;letter-spacing:-.3px;margin-bottom:11px}
.row h3 a{font-size:13px;font-weight:500;color:var(--a2);display:flex;align-items:center;gap:2px}
.row h3 a svg{width:15px;height:15px}
.rail{display:flex;gap:11px;overflow-x:auto;padding:0 18px;scroll-snap-type:x proximity}.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:118px;scroll-snap-align:start}
.card .p{width:100%;aspect-ratio:2/3;border-radius:16px;background:var(--card) center/cover;overflow:hidden;position:relative;border:1px solid var(--line)}
.card .p img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{font-size:12px;color:var(--tx2);margin-top:7px;line-height:1.25;height:30px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rate{position:absolute;top:7px;left:7px;background:rgba(7,7,15,.7);backdrop-filter:blur(6px);font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:10px;color:#ffd166}
.rate::before{content:"★ "}
.tp{position:absolute;bottom:7px;right:7px;font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:3px 7px;border-radius:8px;background:var(--grad)}
.cont .card{width:158px}.cont .p{aspect-ratio:16/10}
.bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#ffffff26}.bar i{display:block;height:100%;background:var(--grad)}
.skel{background:linear-gradient(90deg,#12121f,#1c1c2e,#12121f);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* buscar / explorar */
.sbar{position:sticky;top:0;z-index:6;background:linear-gradient(var(--bg) 70%,transparent);padding:calc(14px + var(--sat)) 16px 12px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 14px;height:50px}
.sbox:focus-within{border-color:var(--a1)}
.sbox input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px;min-width:0}
.sbox svg{color:var(--tx3);width:20px;height:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 11px;padding:8px 16px 20px}
.grid .card{width:100%}
.empty{text-align:center;color:var(--tx3);padding:70px 30px;font-size:14px;line-height:1.6}
.empty svg{width:46px;height:46px;margin-bottom:12px;opacity:.5}
.empty b{color:var(--tx2);display:block;font-size:16px;margin-bottom:4px;font-weight:600}
.seg{display:flex;gap:6px;padding:4px;margin:6px 16px 10px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.seg button{flex:1;padding:10px;border-radius:12px;font-weight:500;color:var(--tx3);font-size:14px}
.seg button.on{background:var(--grad);color:#fff}
.seg.dim button.on{background:var(--card2);color:var(--tx2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13.5px;color:var(--tx2)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;font-weight:600}
.more{display:block;margin:0 auto 20px;color:var(--tx3);font-size:13px;padding:8px 18px}
/* detalle */
.page{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;transform:translateY(8%);opacity:0;visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s}
.page.on{transform:none;opacity:1;visibility:visible}
.dback{position:fixed;top:calc(12px + var(--sat));left:14px;z-index:3;width:42px;height:42px;border-radius:15px;background:rgba(7,7,15,.6);backdrop-filter:blur(10px);display:grid;place-items:center;border:1px solid var(--line)}
.dshare{left:auto;right:14px}
.dhero{position:relative;height:380px;overflow:hidden}
.dhero .bg{position:absolute;inset:-30px;background:center/cover;filter:blur(30px) saturate(1.4);opacity:.6}
.dhero .pst{position:absolute;left:50%;bottom:30px;width:150px;aspect-ratio:2/3;transform:translateX(-50%);border-radius:18px;background:var(--card2) center/cover;box-shadow:0 20px 50px #000b;border:1px solid var(--line)}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,var(--bg))}
.dbody{padding:0 18px 50px;position:relative;z-index:2;margin-top:-14px}
.dbody h1{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.6px;text-align:center;margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:16px}
.dact{display:flex;gap:10px;margin-bottom:18px}.dact .btn{flex:1}
.syn{font-size:14.5px;line-height:1.6;color:#cfcfe2;margin-bottom:12px}
.syn.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.lnk{color:var(--a2);font-size:13px;margin-bottom:12px}
.cast{font-size:13px;color:var(--tx3);line-height:1.6;margin-bottom:8px}.cast b{color:var(--tx2);font-weight:500}
.shead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;font-size:18px;font-weight:600}
select{background:var(--card2);color:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;outline:0}
.ep{display:flex;align-items:center;gap:14px;padding:13px;margin-bottom:9px;background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;text-align:left}
.ep .n{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--a2);flex:none}
.ep .tt{flex:1;font-size:14.5px;line-height:1.25}
.ep .pl{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none}
.ep .pl svg{width:15px;height:15px;fill:#fff;stroke:#fff;margin-left:2px}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(3,3,10,.72);backdrop-filter:blur(4px);z-index:90;display:none}
.sheetbg.on{display:block}
.sheet{position:absolute;left:10px;right:10px;max-width:560px;margin:0 auto;bottom:calc(10px + var(--sab));background:linear-gradient(180deg,#171730,#0f0f1f);border:1px solid #7c5cff44;border-radius:28px;padding:18px;max-height:82%;overflow-y:auto;animation:up .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 60px #7c5cff22}
body.rotmode #sheetbg{inset:auto;top:0;left:100%;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.sh .th{width:46px;height:62px;border-radius:10px;background:var(--card2) center/cover;flex:none}
.sh div{flex:1;min-width:0}.sh small{font-size:11px;letter-spacing:1.4px;color:var(--a2);font-weight:700}
.sh b{display:block;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.xbtn svg{width:18px;height:18px}
.q{font-size:14px;color:var(--tx2);margin-bottom:11px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-bottom:16px}
.opt{padding:15px 12px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);text-align:left;position:relative;transition:.2s}
.opt svg{color:var(--a2);margin-bottom:12px}
.opt b{display:block;font-size:15.5px;font-weight:600}
.opt small{display:block;font-size:11.5px;color:var(--tx3);margin-top:3px;line-height:1.35}
.opt.sel{border-color:var(--a2);background:linear-gradient(135deg,#7c5cff22,#18c8e81a);box-shadow:0 0 0 3px #18c8e81f}
.opt.sel::after{content:"";position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--a2);box-shadow:0 0 10px var(--a2)}
.opt.off{opacity:.38;pointer-events:none}
.tg{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 16px;font-size:14.5px}
.sw{width:50px;height:30px;border-radius:30px;background:var(--card2);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--grad)}.sw.on::after{left:23px}
.btn.full{width:100%;padding:15px}
.srv{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left}
.srv.cur{border-color:var(--a2)}.srv small{color:var(--tx3);font-size:12px;display:block;margin-top:2px}
/* reproductor */
#player{position:fixed;inset:0;background:#000;z-index:80;display:none;overflow:hidden;color:#fff}
#player.on{display:block}
#player.rot{inset:auto;top:0;left:100%;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
#player video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
#player video.cover{object-fit:cover}
#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#pui{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .25s;background:linear-gradient(rgba(0,0,0,.7),transparent 28%,transparent 62%,rgba(0,0,0,.82))}
#pui.show{opacity:1;pointer-events:auto}
#pui button{pointer-events:auto}
.ptop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:calc(12px + var(--sat)) calc(18px + var(--sar)) 0 calc(18px + var(--sal))}
.pbtn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);display:grid;place-items:center;flex:none}
.pt{flex:1;min-width:0}.pt b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt span{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.pt em{font-style:normal;font-size:11px;padding:2px 9px;border-radius:10px;background:rgba(255,255,255,.14)}
.pt em.g{background:var(--grad)}
.pmid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:clamp(28px,12vw,90px)}
.pmid .pbtn{width:54px;height:54px}.pmid .pbtn svg{width:26px;height:26px}
.pmid .pp{width:76px;height:76px;background:var(--grad);box-shadow:0 8px 34px #7c5cff77}
.pmid .pp svg{width:32px;height:32px;fill:#fff;stroke:#fff}
.pbot{position:absolute;left:0;right:0;bottom:0;padding:0 calc(22px + var(--sar)) calc(14px + var(--sab)) calc(22px + var(--sal))}
.prow{display:flex;align-items:center;gap:12px;font-size:12.5px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent;outline:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--a1),var(--a2)) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.22)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #18c8e855}
.pchips{display:flex;gap:9px;margin-top:6px;align-items:center}
.pchips button{padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);font-size:12.5px;display:flex;align-items:center;gap:6px}
.pchips svg{width:15px;height:15px}
.pchips .nx{margin-left:auto;background:var(--grad);font-weight:600}
#pspin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:12px;pointer-events:none;z-index:3;font-size:13px;color:#dcdcf0;text-align:center}
#pspin i{width:46px;height:46px;border:4px solid #ffffff22;border-top-color:var(--a2);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#pspin.on{display:flex}
#punlock{position:absolute;right:calc(20px + var(--sar));top:50%;transform:translateY(-50%);display:none;z-index:4;padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);font-size:13px;align-items:center;gap:7px}
#punlock.on{display:flex}
#pskip{position:absolute;top:50%;transform:translateY(-50%);font-size:15px;font-weight:600;padding:10px 16px;border-radius:30px;background:rgba(0,0,0,.55);display:none;z-index:4}
#player.emb .pmid,#player.emb .prow,#player.emb #plock,#player.emb #pspeed,#player.emb #pfit{display:none}
#player.emb #pui{pointer-events:none;background:none}
#player.emb .pbot{left:auto;padding-bottom:calc(10px + var(--sab))}
#player.emb #pui.show,#player.emb #pui{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sab));transform:translate(-50%,20px);background:#fff;color:#111;padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:120;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ajustes */
.set{padding:6px 16px 30px}
.sg{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden}
.si{display:flex;gap:14px;align-items:center;padding:15px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.si:last-child{border:0}.si svg{color:var(--a2)}.si span{flex:1}
.si b{display:block;font-weight:500;font-size:15px}.si small{color:var(--tx3);font-size:12px}
.fld{padding:15px}.fld label{font-size:12.5px;color:var(--tx2);display:block;margin-bottom:8px}

const rot13=s=>s.replace(/[A-Za-z]/g,c=>String.fromCharCode(c.charCodeAt(0)+(c.toLowerCase()<"n"?13:-13)));
function b64(s){s=s.replace(/[^A-Za-z0-9+/]/g,"");while(s.length%4)s+="=";return atob(s)}

async function rVoe1(u){

    }catch(e){}
  }
  if(!enc){const r2=html.match(/json">\s*\[\s*"([^"]+)"\s*\]\s*<\/script>/i);if(r2)enc=r2[1]}
  if(!enc){
    const sc=[...dom(html).querySelectorAll('script[type="application/json"]')].find(s=>{try{const p=JSON.parse(s.textContent);return Array.isArray(p)&&typeof p[0]==="string"}catch(e){return false}});
    if(sc)enc=JSON.parse(sc.textContent)[0];

    const data=voeDecode(enc,lut)||voeDecode(enc);

function unpack(src){
  const m=src.match(/\}\s*\(\s*'((?:[^'\\]|\\.)*)'\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*'((?:[^'\\]|\\.)*)'\.split\('\|'\)/);
  if(!m)return null;
  const p=m[1].replace(/\\'/g,"'").replace(/\\\\/g,"\\"),a=+m[2],k=m[4].split("|");
  const val=ch=>{const c=ch.charCodeAt(0);return c>=48&&c<=57?c-48:c>=97&&c<=122?c-87:c>=65&&c<=90?c-29:-1};
  const dec=w=>{let n=0;for(const ch of w){const v=val(ch);if(v<0||v>=a)return -1;n=n*a+v}return n};
  return p.replace(/\b\w+\b/g,w=>{const i=dec(w);return i>=0&&k[i]?k[i]:w});
}

async function swPage(page){
  {
    let html=await http(page,{ua:UAFF,referer:page,ms:9000});
    const texts=[];
    html.split(/<script/i).forEach(b=>{if(/eval\(function\(p,a,c,k,e,d\)/.test(b)){const un=unpack(b.slice(b.indexOf("eval(function(p,a,c,k,e,d)")));if(un)texts.push(un)}});
    texts.push(html);
    let l=null;
    for(const t of texts){
      const got={};let m;const re=/["']?(hls[1-4])["']?\s*:\s*["']([^"']+)["']/gi;
      while((m=re.exec(t)))got[m[1].toLowerCase()]=m[2].replace(/\\\//g,"/").replace(/\\u0026/g,"&");
      l=got.hls4||got.hls3||got.hls1||got.hls2||null;
      if(l)break;
    }
    if(!l){for(const t of texts){const f=findMedia(t);if(f){l=f;break}}}
    if(!l)throw new Error(/captcha|cloudflare|just a moment/i.test(html)?"pide verificación":"sin enlace de video");
    const master=/^https?:/i.test(l)?l:new URL(l,page).href;
    try{
      const pl=await http(master,{ua:"Mozilla/5.0",referer:page,ms:5000});
      return bestQuality(pl,master.slice(0,master.lastIndexOf("/")+1))||master;
    }catch(e){return master}
  }
  return null;
}
async function rStreamtape(u){
  const html=await http(u,{ua:UAFF,ms:9000});
  const re=/document\.getElementById\(['"]([^'"]+)['"]\)\.innerHTML\s*=\s*(.+);/g;let m,last=null;
  while((m=re.exec(html))){
    const expr=m[2].replace(/\+ ?''/g,"").replace(/\.substring\((\d+)\)/g,(_,p)=>`.slice(${p})`);
    try{const v=new Function("return "+expr)();if(v&&/get_video/.test(v))last=v}catch(e){}
  }

  return last.startsWith("//")?"https:"+last:last.startsWith("/")?"https://streamtape.com"+last:last;
}

const BAD_URL=/cloudflareinsights|google-analytics|googletagmanager|facebook\.net|beacon|analytics|pixel|bigbuckbunny|test-videos|sample-video|placeholder|\.js(\?|$)/i;
function cleanUrl(u){return u.replace(/\\u0026/g,"&").replace(/\\\//g,"/").replace(/&amp;/g,"&").trim()}
function findMedia(text){
  const out=[];
  const re1=/(?:file|src|source|hls\d?|url|stream)["']?\s*[:=]\s*["'](https?:(?:\\?\/){2}[^"']+?\.(?:m3u8|mp4)[^"']*)["']/gi;
  let m;while((m=re1.exec(text)))out.push(cleanUrl(m[1]));
  const re2=/https?:(?:\\?\/){2}[^\s"'<>\\]+?\.(?:m3u8|mp4)[^\s"'<>\\]*/gi;
  while((m=re2.exec(text)))out.push(cleanUrl(m[0]));
  const good=out.filter(u=>!BAD_URL.test(u));
  return good.find(u=>/\.m3u8/i.test(u))||good[0]||null;
}
async function rGeneric(u,depth=0){
  let ref;try{ref=new URL(u).origin+"/"}catch(e){ref=BASE()+"/"}
  const html=await http(u,{referer:ref,ua:UAFF,ms:9000});
  const texts=[html];
  html.split(/<script/i).forEach(b=>{if(/eval\(function\(p,a,c,k,e,d\)/.test(b)){const un=unpack(b);if(un)texts.push(un)}});
  for(const t of texts){
    const url=findMedia(t);
    if(url){
      if(/\.m3u8/i.test(url)){
        try{const pl=await http(url,{ua:UAFF,referer:u,ms:8000});return bestQuality(pl,url.slice(0,url.lastIndexOf("/")+1))||url}catch(e){return url}
      }
      return url;
    }
  }
  if(depth<2){
    const fm=html.match(/<iframe[^>]+src=["']([^"']+)["']/i);
    if(fm){try{return await rGeneric(new URL(fm[1],u).href,depth+1)}catch(e){}}
  }
  return null;
}
async function resolveEmbed(u){
  let host="",path="";
  try{const x=new URL(u);host=x.hostname.replace(/^www\./,"").toLowerCase();path=x.pathname.toLowerCase()}catch(e){return null}
  try{
    let r=null;
    const lb=host||"servidor",fail=e=>{dg(lb+": "+((e&&e.message)||"error"));return null};
    if(/voe/i.test(host)){r=await rVoe(u).catch(fail);if(!r)return null} // Voe: si su extractor falla, el genérico tampoco sirve
    else if(/wish|awish|playnix|medix|niramirus|kravaxxa|davioad|haxlopp|tryzendm|dumbalag|dhcplay|hglink|hgcloud|hgplay|hglamioz|hanerix|audinifer|vibuxer/i.test(host))r=await rStreamwish(u).catch(fail);
    else if(/vidhide|filelions|[mad]lions|callistanise|minochinos|morencius|smoothpre|dhtpre|peytonepre|movearnpre|mivalyo|dinisglows|dingtezuni|ryderjet/i.test(host)){r=await rStreamwish(u,"vh").catch(fail);if(!r)return null}
    else if(VIDARA_RX.test(host)){r=await rVidara(u).catch(fail);if(!r)return null}
    else if(/zilla|dropload|streamvid|vidguard|vidmoly|lulu|mixdrop/i.test(host))r=await rStreamwish(u,true).catch(fail);
    else if(/streamtape/i.test(host))r=await rStreamtape(u).catch(fail);
    if(r)return r;
    const g=await rGeneric(u);if(!g)dg((host||"servidor")+": sin enlace de video");return g; // respaldo para cualquier servidor
  }catch(e){dg((host||"servidor")+": "+((e&&e.message)||"error"))}
  return null; // último recurso: reproductor embebido
}

      });
      [...map.entries()].forEach(([n,eps])=>{eps.sort((a,b)=>a.number-b.number);info.seasons.push({number:n,name:`Temporada ${n}`,episodes:eps})});
    }

async function api(path){
  const [p,qs]=path.split("?"),q=new URLSearchParams(qs||"");
  try{
    if(p==="/catalog")return await E.catalog(q);
    if(p==="/search")return await E.search(q);

    if(p.startsWith("/info/"))return await E.info(decodeURI(p.slice(6)),q.get("type")||"movie");
    if(p==="/servers")return await E.servers(q);
    if(p==="/resolve")return await E.resolve(q);
    throw new Error("Ruta desconocida");
  }catch(e){
    if(e.name==="AbortError")throw new Error("El sitio tardó demasiado en responder");
    if(e instanceof TypeError)throw new Error("Sin conexión a internet o el sitio no responde");
    throw e;
  }
}

// controles
const seekBy=d=>{const v=P.v;if(v&&v.duration)v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+d))};
$("#pplay").onclick=()=>{const v=P.v;if(!v)return;v.paused?v.play():v.pause()};
$("#prew").onclick=()=>{seekBy(-10);showUI()};$("#pfwd").onclick=()=>{seekBy(10);showUI()};
$("#pback").onclick=()=>history.back();
const sk=$("#pseek");
sk.addEventListener("input",()=>{P.drag=true;const v=P.v;if(v&&v.duration){v.currentTime=sk.value/1000*v.duration;sk.style.setProperty("--p",(sk.value/10)+"%");$("#pcur").textContent=fmt(v.currentTime)}clearTimeout(P.hideT)});
sk.addEventListener("change",()=>{P.drag=false;showUI()});
const SPEEDS=[1,1.25,1.5,2,0.75];
$("#pspeed").onclick=()=>{const v=P.v;if(!v)return;const k=(SPEEDS.indexOf(v.playbackRate)+1)%SPEEDS.length;v.playbackRate=SPEEDS[k];$("#pspeed").textContent=SPEEDS[k]+"x";showUI()};
$("#pfit").onclick=()=>{const v=P.v;if(!v)return;v.classList.toggle("cover");showUI()};
$("#pnext").onclick=()=>{const n=nextEp();if(n)goNext(n)};
$("#plock").onclick=()=>{P.locked=true;hideUI();toast("Controles bloqueados")};
$("#punlock").onclick=()=>{P.locked=false;$("#punlock").classList.remove("on");showUI()};
$("#psrv").onclick=()=>{
  const c=P.ctx;if(!c)return;
  sheet(sheetHead(c.info,"FUENTES · "+P.lang.toUpperCase())+P.list.map((s,k)=>`<button class="srv ${k===P.idx&&!P.el.classList.contains("emb")?"cur":""}" data-k="${k}"><span>${esc(s.name)}<small>Probar esta fuente</small></span>${IC.arrow}</button>`).join("")+`<button class="btn sec full" id="chlang" style="margin-top:6px">${IC.lang}&nbsp;Cambiar idioma</button>`);
  $("#sx").onclick=closeSheet;
  $$(".srv").forEach(b=>b.onclick=()=>{closeSheet();P.tok++;const k=+b.dataset.k;P.list=[P.list[k]];P.idx=0;playFrom(0,P.v?P.v.currentTime:0)});
  $("#chlang").onclick=()=>renderLangSheet(c);
};
let lastTap=0,tapT=null,skipT;
P.el.addEventListener("click",e=>{
  if(e.target.closest("button,input"))return;
  if(P.el.classList.contains("emb"))return;
  if(P.locked){$("#punlock").classList.add("on");clearTimeout(skipT);skipT=setTimeout(()=>$("#punlock").classList.remove("on"),2500);return}
  const now=Date.now(),frac=P.el.classList.contains("rot")?e.clientY/innerHeight:e.clientX/innerWidth;
  if(now-lastTap<300){
    clearTimeout(tapT);lastTap=0;
    if(frac<.4||frac>.6){
      const d=frac<.5?-10:10;seekBy(d);
      const sp=$("#pskip");sp.textContent=(d>0?"+":"−")+"10 s";sp.style.left=d>0?"auto":"12%";sp.style.right=d>0?"12%":"auto";sp.style.display="block";
      clearTimeout(skipT);skipT=setTimeout(()=>sp.style.display="none",600);
    }
    return;
  }
  lastTap=now;
  tapT=setTimeout(()=>{$("#pui").classList.contains("show")?hideUI():showUI()},260);
});
// ---------- ajustes ----------
function renderSettings(){
  const v=$("#v-set");
  v.innerHTML=`<h1 class="t">Ajustes</h1><div class="set">
  <div class="sg"><div class="fld"><label>Idioma al reproducir</label><select id="slang" style="width:100%"><option value="ask">Preguntar cada vez</option><option>Latino</option><option>Castellano</option><option>Subtitulado</option></select></div></div>
  <div class="sg"><div class="fld"><label>Dominio del catálogo (cámbialo si el sitio cambia de dirección)</label><input id="apiurl" value="${esc(S.dom||DEF_DOM)}" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="${DEF_DOM}"><button class="btn" id="apisave">Guardar y probar</button></div></div>
  <div class="sg">
   <button class="si" id="sclr">${IC.trash}<span><b>Borrar “Continuar viendo”</b><small>${S.hist.length} elementos</small></span></button>
   <button class="si" id="sfav">${IC.heart}<span><b>Vaciar Mi lista</b><small>${S.favs.length} títulos</small></span></button>
  </div><div class="sg"><button class="si" id="supd">${IC.heart}<span><b>Buscar actualizaciones</b><small>Versión instalada: v${APP_VER}</small></span></button></div><div class="ver">Tramoya v${APP_VER}</div></div>`;
  $("#slang").value=S.lang;$("#slang").onchange=e=>{S.lang=e.target.value;ls.set("tr_lang",S.lang);toast("Guardado")};
  $("#apisave").onclick=async()=>{
    let u=$("#apiurl").value.trim();if(!u)return toast("Escribe el dominio");if(!/^https?:\/\//i.test(u))u="https://"+u;
    S.dom=u.replace(/\/+$/,"");ls.set("tr_dom",S.dom);toast("Probando conexión…");
    try{const r=await api("/catalog?type=movie&page=1");if(!r.items.length)throw new Error("Sin resultados: revisa el dominio");toast("Conectado ✓");X.items=[];X.done=false;X.dirty=true;loadHome()}catch(e){toast(e.message)}
  };
  $("#supd").onclick=()=>checkUpdate(true);
  $("#sclr").onclick=()=>{S.hist=[];save();renderSettings();toast("Historial borrado")};
  $("#sfav").onclick=()=>{S.favs=[];save();renderSettings();toast("Lista vaciada")};
}
// ---------- actualización obligatoria ----------
const APP_VER="__APP_VERSION__".startsWith("__")?"0.0.0-dev":"__APP_VERSION__";
const REPO="EduardYT9088/Pel-culas-Series-NX";
const capP=n=>{try{const c=window.Capacitor;return c&&c.isNativePlatform&&c.isNativePlatform()?((c.Plugins&&c.Plugins[n])||c.registerPlugin(n)):null}catch(e){return null}};
const cmpVer=(a,b)=>{const x=String(a).split(/[.-]/).map(n=>parseInt(n)||0),y=String(b).split(/[.-]/).map(n=>parseInt(n)||0);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return(x[i]||0)-(y[i]||0)}return 0};
let UPD=null;
async function checkUpdate(manual){
  if(APP_VER.includes("dev")){if(manual)toast("Versión de prueba: instala el APK para buscar actualizaciones");return false}
  try{
    const r=await Promise.race([CAPH.get({url:`https://api.github.com/repos/${REPO}/releases/latest`,headers:{"Accept":"application/vnd.github+json","User-Agent":"Tramoya-App"},connectTimeout:12000,readTimeout:12000}),new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),14000))]);
    const d=typeof r.data==="string"?JSON.parse(r.data):r.data;
    const ver=String(d.tag_name||"").replace(/^v/i,"");
    if(!ver||cmpVer(ver,APP_VER)<=0){if(manual)toast(`Ya tienes la última versión (v${APP_VER})`);return false}
    const apk=(d.assets||[]).find(a=>/\.apk$/i.test(a.name));
    if(!apk){if(manual)toast("La nueva versión aún se está publicando");return false}
    UPD={ver,notes:d.body||"",url:apk.browser_download_url,size:apk.size};showUpdate();return true;
  }catch(e){if(manual)toast("No se pudo buscar actualizaciones");return false}
}
function showUpdate(){
  const u=UPD;$("#uver").textContent="v"+u.ver;
  $("#ucur").textContent=`Tienes la v${APP_VER}`+(u.size?` · ${(u.size/1048576).toFixed(1)} MB`:"");
  const ls2=String(u.notes||"").split("\n").map(l=>l.trim()).filter(l=>l&&!/^(co-authored-by|claude-session|signed-off-by)/i.test(l));
  $("#unotes").innerHTML=ls2.length?"<ul>"+ls2.map(l=>`<li>${esc(l.replace(/^[-•*]\s*/,""))}</li>`).join("")+"</ul>":"<p>Mejoras y correcciones.</p>";
  $("#uprg").style.display="none";$("#ugo").disabled=false;$("#ugo").textContent="Actualizar ahora";
  $("#updov").classList.add("on");history.pushState({u:1},"");
}
$("#ugo").onclick=async()=>{
  const u=UPD,FS=capP("Filesystem"),FO=capP("FileOpener");
  $("#ugo").disabled=true;$("#ugo").textContent="Descargando…";$("#uprg").style.display="block";$("#ubar").style.width="0%";$("#uptx").textContent="Preparando descarga…";
  if(FS&&FO){
    let hd=null;try{hd=await FS.addListener("progress",p=>{const pc=p.contentLength?Math.round(p.bytes/p.contentLength*100):0;$("#ubar").style.width=pc+"%";$("#uptx").textContent=`Descargando… ${pc}%`})}catch(e){}
    try{
      const res=await FS.downloadFile({url:u.url,path:"tramoya-update.apk",directory:"CACHE",progress:true,recursive:true});
      let path=res&&res.path;if(!path||!/^file:|^\//.test(path)){const g=await FS.getUri({path:"tramoya-update.apk",directory:"CACHE"});path=g.uri}
      $("#ubar").style.width="100%";$("#uptx").textContent="Listo. Confirma la instalación en la ventana de Android.";
      await FO.openFile({path,mimeType:"application/vnd.android.package-archive"});
      $("#ugo").disabled=false;$("#ugo").textContent="Instalar";return;
    }catch(e){$("#uptx").textContent="No se pudo instalar desde la app. Se abrirá la descarga en el navegador."}
    finally{try{hd&&hd.remove&&hd.remove()}catch(e){}}
  }
  setTimeout(()=>{window.open(u.url,"_system");$("#ugo").disabled=false;$("#ugo").textContent="Descargar de nuevo"},900);
};
setTimeout(()=>checkUpdate(false),2500);
// ---------- navegación atrás ----------
addEventListener("popstate",()=>{
  if($("#updov").classList.contains("on")){history.pushState({u:1},"");return}
  if(P.el.classList.contains("on")){closePlayer();return}
  if($("#sheetbg").classList.contains("on")){closeSheet();history.pushState({d:1},"");return}
  if($("#detail").classList.contains("on"))closeDetail();
});
// ---------- arranque ----------
orient("portrait");
loadHome();
setTimeout(()=>{const s=$("#splash");s.style.opacity=0;setTimeout(()=>s.remove(),500)},1000);
})();
</script>
