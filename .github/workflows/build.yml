name: Build Tramoya APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.1.0"   # <- sube este número en cada versión nueva (las actualizaciones se detectan por él)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar proyecto Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" www/index.html
          cat > package.json <<'EOF2'
          {"name":"tramoya","version":"1.0.0","private":true}
          EOF2
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/screen-orientation@6 @capacitor/filesystem@6 @capawesome-team/capacitor-file-opener@6 hls.js@1.5.8
          cp node_modules/hls.js/dist/hls.min.js www/hls.min.js
          cat > capacitor.config.json <<'EOF2'
          {
            "appId": "com.tramoya.app",
            "appName": "Tramoya",
            "webDir": "www",
            "backgroundColor": "#07070f",
            "server": { "androidScheme": "http", "cleartext": true },
            "android": { "allowMixedContent": true }
          }
          EOF2
          npx cap add android
          npx cap sync android

      - name: Ícono de la app
        continue-on-error: true
        run: |
          convert -size 512x512 gradient:'#7c5cff-#18c8e8' \( -size 512x512 xc:none -fill white -draw "polygon 196,140 196,372 380,256" \) -composite icon.png
          res=android/app/src/main/res
          rm -rf $res/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=$res/mipmap-${d%%:*}; sz=${d##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon.png -resize ${sz}x${sz} $dir/$n.png
            done
          done

      - name: Estilo nativo (barras oscuras)
        run: |
          f=android/app/src/main/res/values/styles.xml
          sed -i 's#</style>#    <item name="android:statusBarColor">\#07070f</item>\n        <item name="android:navigationBarColor">\#07070f</item>\n        <item name="android:windowBackground">\#07070f</item>\n    </style>#' $f || true

      - name: Bloquear redirecciones de anuncios (Google, Play Store, etc.)
        run: |
          d=android/app/src/main/java/com/tramoya/app
          mkdir -p $d
          cat > $d/MainActivity.java <<'EOF2'
          package com.tramoya.app;

          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView wv = getBridge().getWebView();
              wv.getSettings().setSupportMultipleWindows(false);
              // el reproductor web (Voe, etc.) necesita guardar su cookie de "no soy un robot"
              CookieManager.getInstance().setAcceptCookie(true);
              CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true);
              wv.setWebViewClient(new BridgeWebViewClient(getBridge()) {
                private boolean ownUrl(String u) {
                  return u != null && (u.startsWith("http://localhost") || u.startsWith("about:") || u.startsWith("blob:") || u.startsWith("data:"));
                }
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                  // Si un anuncio intenta sacar la app de su pantalla (Google, Play Store, otro navegador), se bloquea.
                  if (request.isForMainFrame() && !ownUrl(request.getUrl().toString())) return true;
                  return super.shouldOverrideUrlLoading(view, request);
                }
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, String url) {
                  if (!ownUrl(url)) return true;
                  return super.shouldOverrideUrlLoading(view, url);
                }
              });
            }
          }
          EOF2

      - name: Permiso de instalación, versión y firma fija
        env:
          NEXORA_KEYSTORE: ${{ secrets.NEXORA_KEYSTORE }}
        run: |
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml || sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          if [ -n "$NEXORA_KEYSTORE" ]; then
            echo "$NEXORA_KEYSTORE" | base64 -d > android/app/nexora.keystore
            sed -i "0,/^android {/s//android {\n    signingConfigs { debug { storeFile file('nexora.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }/" android/app/build.gradle
            grep -q "nexora.keystore" android/app/build.gradle && echo "Firma fija OK" || { echo "No se pudo configurar la firma"; exit 1; }
          else
            echo "::warning::Falta el secreto NEXORA_KEYSTORE: el APK se firma con una clave temporal y no se podrá instalar encima de la anterior."
          fi

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Tramoya-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Solo al subir a main se publica en Releases (las ramas de prueba NO publican nada)
      - name: Preparar APK para Releases
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Tramoya-v${APP_VERSION}.apk"

      - name: Reemplazar release anterior de la misma versión
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${APP_VERSION}" --cleanup-tag -y --repo "${{ github.repository }}" || true

      - name: Publicar en Releases
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Tramoya v${{ env.APP_VERSION }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message || 'Nueva versión de Tramoya' }}
          files: out/*.apk
